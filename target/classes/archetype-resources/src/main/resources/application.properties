#set( $symbol_pound = '#' )
#set( $symbol_dollar = '$' )
#set( $symbol_escape = '\' )
spring.application.name=${artifactId}
${symbol_pound} Servidor
server.port=8081

${symbol_pound} H2 — base de datos en memoria
spring.datasource.url=jdbc:h2:mem:arquetipodb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

${symbol_pound} Consola H2 (útil para ver los datos en desarrollo)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

${symbol_pound} JPA
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

${symbol_pound} Nombre de la aplicación
spring.application.name=${artifactId}